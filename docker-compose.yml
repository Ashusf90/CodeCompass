services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: codecompass
    ports:
      - "5433:5432"
    volumes:
      - codecompass_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codecompass"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/codecompass
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8000
      AUTH_COOKIE_SECURE: "false"
      HF_HOME: /app/.cache/huggingface
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data/repos:/app/data/repos
      - codecompass_models:/app/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m app.db.init_db &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  codecompass_pgdata:
    external: true
    name: codecompass_codecompass_pgdata
  codecompass_models:
